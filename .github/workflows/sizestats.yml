name: Generate size statistics

on:
  issues:
    types: [opened, reopened]

jobs:
  check_title:
    runs-on: ubuntu-latest

    steps:
      - name: Check title is correct
        if: ${{ !(github.event.issue.title > 0) }}
        run: |
          curl \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body":"Error: issue title must be a pull request number. Reopen once you fix this."}'

          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }} \
            -d '{"state":"closed"}'

          exit 1

  build:
    needs: check_title
    strategy:
      matrix:
        include:
          - os: linux
            osrid: linux
            arch: x64
            ilctools: ilc-published
            vm: ubuntu-latest
            buildscript: ./build.sh
            propertyswitch: '-'
          - os: windows
            osrid: win
            arch: x64
            ilctools: ilc-published
            vm: windows-latest
            buildscript: .\build.cmd
            propertyswitch: '/'
          - os: wasi
            osrid: wasi
            arch: wasm
            ilctools: x64/ilc
            vm: ubuntu-latest
            buildscript: ./build.sh
            propertyswitch: '-'
            buildargs: -os wasi -arch wasm
            extrasubsets: +host.native
    runs-on: ${{ matrix.vm }}
    steps:
      - name: Install dependencies
        if: ${{ matrix.os != 'windows' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libkrb5-dev liblttng-ust-dev ninja-build libicu-dev libssl-dev
      - name: Install WASI SDK
        if: ${{ matrix.os == 'wasi' }}
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Checkout runtime repo
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          fetch-depth: 0
          path: runtime
          show-progress: true
      - name: Create baseline and compare branches (Linux)
        if: ${{ matrix.os != 'windows' }}
        run: cd runtime && git -c protocol.version=2 fetch --progress origin pull/${{ github.event.issue.title }}/head:compare && git branch baseline $(git merge-base compare main)
      - name: Create baseline and compare branches (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: cmd
        run: |
          cd runtime
          git -c protocol.version=2 fetch --progress origin pull/${{ github.event.issue.title }}/head:compare
          for /f "tokens=*" %%i in ('git merge-base compare main') do set BASELINE_COMMIT=%%i
          git branch baseline %BASELINE_COMMIT%
      - name: Build baseline
        run: |
          cd runtime
          git checkout baseline
          git rev-parse HEAD
          ${{ matrix.buildscript }} clr.aot+libs.native+libs.sfx${{ matrix.extrasubsets }} -c Release ${{ matrix.buildargs }} ${{ matrix.propertyswitch }}p:RunAnalyzers=false ${{ matrix.propertyswitch }}p:NoPgoOptimize=true
      - name: Package baseline WASI runtime
        if: ${{ matrix.os == 'wasi' }}
        run: |
          cd runtime
          ./build.sh --projects "$PWD/src/installer/pkg/sfx/Microsoft.NETCore.App/Microsoft.NETCore.App.Runtime.NativeAOT.sfxproj" --restore --build --pack -c Release -os wasi -arch wasm
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'wasi' }}
        with:
          name: baseline-wasi-runtimepack
          retention-days: 1
          if-no-files-found: error
          path: |
            runtime/artifacts/packages/Release/Shipping/Microsoft.NETCore.App.Runtime.NativeAOT.wasi-wasm.*.nupkg
            !runtime/artifacts/packages/Release/Shipping/Microsoft.NETCore.App.Runtime.NativeAOT.wasi-wasm.*.symbols.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}
          retention-days: 1
          path: |
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/aotsdk
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/build
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/ilc-published
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/${{ matrix.ilctools }}
            runtime/artifacts/bin/microsoft.netcore.app.runtime.${{ matrix.osrid }}-${{ matrix.arch }}/Release/runtimes/${{ matrix.osrid }}-${{ matrix.arch }}/lib/net12.0
            runtime/artifacts/bin/microsoft.netcore.app.runtime.${{ matrix.osrid }}-${{ matrix.arch }}/Release/runtimes/${{ matrix.osrid }}-${{ matrix.arch }}/native
      - name: Taskkill dotnet.exe
        if: ${{ matrix.os == 'windows' }}
        run: taskkill -im dotnet.exe -f
      - name: Build compare
        run: |
          cd runtime
          git checkout compare
          git rev-parse HEAD
          ${{ matrix.buildscript }} clr.aot+libs.native+libs.sfx${{ matrix.extrasubsets }} -c Release ${{ matrix.buildargs }} ${{ matrix.propertyswitch }}p:RunAnalyzers=false ${{ matrix.propertyswitch }}p:NoPgoOptimize=true
      - name: Package compare WASI runtime
        if: ${{ matrix.os == 'wasi' }}
        run: |
          cd runtime
          ./build.sh --projects "$PWD/src/installer/pkg/sfx/Microsoft.NETCore.App/Microsoft.NETCore.App.Runtime.NativeAOT.sfxproj" --restore --build --pack -c Release -os wasi -arch wasm
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'wasi' }}
        with:
          name: compare-wasi-runtimepack
          retention-days: 1
          if-no-files-found: error
          path: |
            runtime/artifacts/packages/Release/Shipping/Microsoft.NETCore.App.Runtime.NativeAOT.wasi-wasm.*.nupkg
            !runtime/artifacts/packages/Release/Shipping/Microsoft.NETCore.App.Runtime.NativeAOT.wasi-wasm.*.symbols.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: compare-${{ matrix.os }}
          retention-days: 1
          path: |
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/aotsdk
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/build
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/ilc-published
            runtime/artifacts/bin/coreclr/${{ matrix.os }}.${{ matrix.arch }}.Release/${{ matrix.ilctools }}
            runtime/artifacts/bin/microsoft.netcore.app.runtime.${{ matrix.osrid }}-${{ matrix.arch }}/Release/runtimes/${{ matrix.osrid }}-${{ matrix.arch }}/lib/net12.0
            runtime/artifacts/bin/microsoft.netcore.app.runtime.${{ matrix.osrid }}-${{ matrix.arch }}/Release/runtimes/${{ matrix.osrid }}-${{ matrix.arch }}/native

  dotnet:
    needs: build
    strategy:
      matrix:
        os: [linux, windows, wasi]
        flavor: [baseline, compare]
        project:
          - hello
          - hello-minimal
          - webapiaot
          - avalonia.app
          - reflection
          - kestrel-minimal
          - TodosApi
        exclude:
          - os: wasi
            project: webapiaot
          - os: wasi
            project: avalonia.app
          - os: wasi
            project: kestrel-minimal
          - os: wasi
            project: TodosApi
        include:
          - os: linux
            osrid: linux
            arch: x64
            vm: ubuntu-latest
          - os: windows
            osrid: win
            arch: x64
            vm: windows-latest
          - os: wasi
            osrid: wasi
            arch: wasm
            binaryext: .wasm
            vm: ubuntu-latest
    runs-on: ${{ matrix.vm }}
    steps:

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "12.0"
          dotnet-quality: daily
      - name: Checkout repo
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.os }}
      - uses: actions/download-artifact@v4
        if: ${{ matrix.os == 'wasi' }}
        with:
          name: ${{ matrix.flavor }}-wasi-runtimepack
          path: runtime-pack
      - name: Configure WASI runtime pack
        if: ${{ matrix.os == 'wasi' }}
        run: |
          packages=(runtime-pack/Microsoft.NETCore.App.Runtime.NativeAOT.wasi-wasm.*.nupkg)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          version=${packages[0]#runtime-pack/Microsoft.NETCore.App.Runtime.NativeAOT.wasi-wasm.}
          echo "WASI_RUNTIME_PACK_VERSION=${version%.nupkg}" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/wasi-nuget-packages" >> "$GITHUB_ENV"
      - name: Install WASI SDK
        if: ${{ matrix.os == 'wasi' }}
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Publish (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          chmod +x $GITHUB_WORKSPACE/coreclr/linux.x64.Release/ilc-published/ilc
          cd src/${{ matrix.project }}
          dotnet publish -p:ILCompilerTargetsPath=$GITHUB_WORKSPACE/coreclr/linux.x64.Release/build/Microsoft.DotNet.ILCompiler.SingleEntry.targets -p:IlcBuildTasksPath=$GITHUB_WORKSPACE/coreclr/linux.x64.Release/ilc-published/netstandard/ILCompiler.Build.Tasks.dll -p:IlcToolsPath=$GITHUB_WORKSPACE/coreclr/linux.x64.Release/ilc-published/ -p:IlcSdkPath=$GITHUB_WORKSPACE/coreclr/linux.x64.Release/aotsdk/ -p:IlcFrameworkPath=$GITHUB_WORKSPACE/microsoft.netcore.app.runtime.linux-x64/Release/runtimes/linux-x64/lib/net12.0/ -p:IlcFrameworkNativePath=$GITHUB_WORKSPACE/microsoft.netcore.app.runtime.linux-x64/Release/runtimes/linux-x64/native/ -p:IlcGenerateMstatFile=true -p:IlcGenerateDgmlFile=true -p:IlcGenerateMapFile=true ${{ toJson(github.event.issue.labels) == '[]' && ' ' || format('-p:{0}', join(github.event.issue.labels.*.name, ' -p:')) }}
      - name: Publish (WASI)
        if: ${{ matrix.os == 'wasi' }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/coreclr/wasi.wasm.Release/x64/ilc/ilc"
          cd src/${{ matrix.project }}
          dotnet publish -p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true -r wasi-wasm \
            -p:WasiRuntimePackVersion="$WASI_RUNTIME_PACK_VERSION" -p:RestoreConfigFile="$GITHUB_WORKSPACE/.github/wasi.nuget.config" \
            -p:CustomAfterMicrosoftCommonTargets="$GITHUB_WORKSPACE/.github/wasi-runtime-pack.targets" \
            -p:ILCompilerTargetsPath="$GITHUB_WORKSPACE/coreclr/wasi.wasm.Release/build/Microsoft.DotNet.ILCompiler.SingleEntry.targets" \
            -p:IlcBuildTasksPath="$GITHUB_WORKSPACE/coreclr/wasi.wasm.Release/ilc-published/netstandard/ILCompiler.Build.Tasks.dll" \
            -p:IlcToolsPath="$GITHUB_WORKSPACE/coreclr/wasi.wasm.Release/x64/ilc/" \
            -p:IlcGenerateMstatFile=true -p:IlcGenerateDgmlFile=true -p:IlcGenerateMapFile=true ${{ toJson(github.event.issue.labels) == '[]' && ' ' || format('-p:{0}', join(github.event.issue.labels.*.name, ' -p:')) }}
      - name: Publish (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: cmd
        run: |
          cd src\${{ matrix.project }}
          dotnet publish -p:ILCompilerTargetsPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\build\Microsoft.DotNet.ILCompiler.SingleEntry.targets -p:IlcBuildTasksPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\ilc-published\netstandard\ILCompiler.Build.Tasks.dll -p:IlcToolsPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\ilc-published\ -p:IlcSdkPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\aotsdk\ -p:IlcFrameworkPath=%GITHUB_WORKSPACE%\microsoft.netcore.app.runtime.win-x64\Release\runtimes\win-x64\lib\net12.0\ -p:IlcFrameworkNativePath=%GITHUB_WORKSPACE%\microsoft.netcore.app.runtime.win-x64\Release\runtimes\win-x64\native\ -p:IlcGenerateMstatFile=true -p:IlcGenerateDgmlFile=true -p:IlcGenerateMapFile=true ${{ toJson(github.event.issue.labels) == '[]' && ' ' || format('-p:{0}', join(github.event.issue.labels.*.name, ' -p:')) }}
      - uses: actions/upload-artifact@v4
        id: artifact-upload-step
        with:
          retention-days: 90
          name: logs-${{ matrix.project }}-${{ matrix.flavor }}-${{ matrix.os }}
          path: |
            src/${{ matrix.project }}/obj/Release/net12.0/${{ matrix.osrid }}-${{ matrix.arch }}/native/${{ matrix.project }}.mstat
            src/${{ matrix.project }}/obj/Release/net12.0/${{ matrix.osrid }}-${{ matrix.arch }}/native/${{ matrix.project }}.map.xml
            src/${{ matrix.project }}/obj/Release/net12.0/${{ matrix.osrid }}-${{ matrix.arch }}/native/*.dgml.xml
      - name: Log stats (Linux host)
        if: ${{ matrix.os != 'windows' }}
        run: |
          echo -n '${{ steps.artifact-upload-step.outputs.artifact-url }} ' > ${{ matrix.project }}-${{ matrix.os }}.${{ matrix.flavor }}.txt
          stat -c%s src/${{ matrix.project }}/bin/Release/net12.0/${{ matrix.osrid }}-${{ matrix.arch }}/native/${{ matrix.project }}${{ matrix.binaryext }} >> ${{ matrix.project }}-${{ matrix.os }}.${{ matrix.flavor }}.txt
          ls -la src/${{ matrix.project }}/bin/Release/net12.0/${{ matrix.osrid }}-${{ matrix.arch }}/native/
      - name: Log stats (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: cmd
        run: |
          FOR /F "usebackq" %%A IN ('src\${{ matrix.project }}\bin\Release\net12.0\win-x64\native\${{ matrix.project }}.exe') DO set SIZE=%%~zA
          <nul set /p="${{ steps.artifact-upload-step.outputs.artifact-url }} %SIZE%" > ${{ matrix.project }}-${{ matrix.os }}.${{ matrix.flavor }}.txt
          echo Size is %SIZE%
          dir src\${{ matrix.project }}\bin\Release\net12.0\win-x64\native\
      - uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.project }}-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ matrix.project }}-${{ matrix.os }}.${{ matrix.flavor }}.txt
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: binaries-${{ matrix.project }}-${{ matrix.os }}-${{ matrix.flavor }}
          path: src/${{ matrix.project }}/bin/Release/net12.0/${{ matrix.osrid }}-${{ matrix.arch }}/native/*
  
  msbuild:
    needs: build
    strategy:
      matrix:
        flavor: [baseline, compare]
        project: [
#          { name: winrt-component-full, binary: winrt_component_full.dll },
          { name: winrt-component-minimal, binary: winrt_component_minimal.dll }
        ]
    runs-on: windows-latest
    steps:

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "12.0"
          dotnet-quality: daily
      - name: Checkout repo
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.flavor }}-windows
      - name: Publish
        shell: cmd
        run: |
          cd src\${{ matrix.project.name }}
          dotnet msbuild /restore -t:publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 -p:ILCompilerTargetsPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\build\Microsoft.DotNet.ILCompiler.SingleEntry.targets -p:IlcBuildTasksPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\ilc-published\netstandard\ILCompiler.Build.Tasks.dll -p:IlcToolsPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\ilc-published\ -p:IlcSdkPath=%GITHUB_WORKSPACE%\coreclr\windows.x64.Release\aotsdk\ -p:IlcFrameworkPath=%GITHUB_WORKSPACE%\microsoft.netcore.app.runtime.win-x64\Release\runtimes\win-x64\lib\net12.0\ -p:IlcFrameworkNativePath=%GITHUB_WORKSPACE%\microsoft.netcore.app.runtime.win-x64\Release\runtimes\win-x64\native\ -p:IlcGenerateMstatFile=true -p:IlcGenerateDgmlFile=true -p:IlcGenerateMapFile=true ${{ toJson(github.event.issue.labels) == '[]' && ' ' || format('-p:{0}', join(github.event.issue.labels.*.name, ' -p:')) }}
      - uses: actions/upload-artifact@v4
        id: artifact-upload-step
        with:
          retention-days: 90
          name: logs-${{ matrix.project.name }}-${{ matrix.flavor }}-windows
          path: |
            src/${{ matrix.project.name }}/obj/x64/Release/net12.0-windows10.0.22621.0/win-x64/native/*.mstat
            src/${{ matrix.project.name }}/obj/x64/Release/net12.0-windows10.0.22621.0/win-x64/native/*.map.xml
            src/${{ matrix.project.name }}/obj/x64/Release/net12.0-windows10.0.22621.0/win-x64/native/*.dgml.xml
      - name: Log stats
        shell: cmd
        run: |
          FOR /F "usebackq" %%A IN ('src\${{ matrix.project.name }}\bin\x64\Release\net12.0-windows10.0.22621.0\win-x64\native\${{ matrix.project.binary }}') DO set SIZE=%%~zA
          <nul set /p="${{ steps.artifact-upload-step.outputs.artifact-url }} %SIZE%" > ${{ matrix.project.name }}-windows.${{ matrix.flavor }}.txt
          echo Size is %SIZE%
          dir src\${{ matrix.project.name }}\bin\x64\Release\net12.0-windows10.0.22621.0\win-x64\native\
      - uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.project.name }}-windows-${{ matrix.flavor }}
          path: ${{ matrix.project.name }}-windows.${{ matrix.flavor }}.txt
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: binaries-${{ matrix.project.name }}-windows-${{ matrix.flavor }}
          path: src/${{ matrix.project.name }}/bin/x64/Release/net12.0-windows10.0.22621.0/win-x64/native/*

  summarize:
    needs: [dotnet, msbuild]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          merge-multiple: true
      - run: |
          echo -n '{"body":"# Size statistics\n\n' > table.txt
          echo -n "Pull request dotnet/runtime#${{ github.event.issue.title }}\n\n" >> table.txt
          echo -n "| Project | Size before | Size after | Difference |\n" >> table.txt
          echo -n "|---------|-------------|------------|------------|\n" >> table.txt
          for file in *.baseline.txt; do
            projectname=${file%.baseline.txt}
              read -r url1 num1 < "$file" || true
              read -r url2 num2 < "$projectname.compare.txt" || true
              diff=$((num2 - num1))
              echo -n "| $projectname | [ $num1 ]($url1) | [ $num2 ]($url2) | $diff |\n" >> table.txt
          done
          echo -n '"}' >> table.txt

          cat table.txt
          echo

          curl \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d @table.txt

          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }} \
            -d '{"state":"closed"}'
